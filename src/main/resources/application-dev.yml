server:
  port: 9000

spring:
  data:
    mongodb:
      database: ApexHire
      uri: mongodb://localhost:27017

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}

# 900000 ms = 15 minutes.
